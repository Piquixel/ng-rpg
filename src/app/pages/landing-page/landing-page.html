<hgroup>
  <img src="/katana-sword.svg" alt="Crossed katana swords" />
  <h1>Tails of Angular</h1>
  <p>Play smart, win big</p>
</hgroup>
<div>
  <button routerLink="/create-character">✨New Game</button>
  <div>
    @for (player of playerService.savedPlayers; track player.nickname) {
      <button (click)="initGameWithSavedPlayer(player)">
        {{ player.nickname }}
      </button>
    }
  </div>
</div>
<div>
  <span>⚔️ Turn-based combat</span>
  <span>🧙‍♀️ 3 playable guilds</span>
  <span>🌳 3 exploration zones</span>
  <span>🛍️ Inventory et shops</span>
</div>
