<main class="homeScreen">
  <img class="homeScreen__branding" src="/logo.svg" alt="" />
  <div class="homeScreen__menu">
    <hgroup class="homeScreen__menu__header">
      <h1 class="homeScreen__menu__header__title headingLv1">Tails of Angular</h1>
      <p class="homeScreen__menu__header__subtitle">Play smart, win big</p>
    </hgroup>
    <button class="btnPrimary" routerLink="/create-character">New Adventure</button>
    @if (playerService.hasSavedPlayers) {
      <hr class="divider" />
      <span class="homeScreen__menu__title">Load an Adventure</span>
      <div class="homeScreen__menu__subContainer">
        @for (player of playerService.savedPlayers; track player.nickname) {
          <button class="btnUtility spaced" (click)="initGameWithSavedPlayer(player)">
            {{ player.icon }}{{ player.nickname }}
            <span>Lvl {{ player.lvl }}</span>
          </button>
        }
      </div>
    }
    <hr class="divider" />
    <div class="featureGrid">
      <span class="featureGrid__item">⚔️ Turn-based combat</span>
      <span class="featureGrid__item">🧙‍♀️ 3 playable guilds</span>
      <span class="featureGrid__item">🌳 3 exploration zones</span>
      <span class="featureGrid__item">🛍️ Inventory et shops</span>
    </div>
  </div>
</main>
