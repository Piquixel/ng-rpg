@let player = gameManager.currentPlayer;

<app-player-stats [player]="player" />

<hgroup>
  <h2>🗺️World Map</h2>
  <p>Choose a zone to fight in</p>
</hgroup>
<div>
  <div>
    <app-map-selector (zoneSelected)="redirectToFight($event)" [lvl]="player.lvl" />
  </div>
  <span class="actions">
    <button class="btnUtility w-full">🏰Go back to the city</button>
    <button class="btnUtility w-full">🎒Inventory</button>
  </span>
</div>
