@let player = gameManager.currentPlayer;

<app-player-stats [player]="player" />

<hgroup>
  <h2>🗺️World Map</h2>
  <p>Choose a zone to fight in</p>
</hgroup>
<div class="container">
  <div class="pickerContainer">
    <app-map-selector (zoneSelected)="redirectToFight()" [lvl]="player.lvl" />
  </div>
  <span>
    <button>🏰Go back to the city</button>
    <button>🎒Inventory</button>
  </span>
</div>
