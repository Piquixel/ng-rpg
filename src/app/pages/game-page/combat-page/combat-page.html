@if (gameManager.state() !== GameState.NONE) {
  <div class="fight-main">
    <app-player-card [isPlayer]="true" />
    <h2>vs</h2>
    <app-player-card [isPlayer]="false" />
  </div>

  <app-fight-history [entries]="log.logEntries" />
  <app-action-bar
    [disabled]="isActive"
    (playerAtk)="gameManager.fightLoop()"
    (playerQuit)="gameManager.returnToMap(false)" />
} @else {
  <div>
    <h1>ERROR</h1>
  </div>
}
