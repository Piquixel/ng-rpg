<h2 class="title-2">⚔️ Create A Hero</h2>
<div class="fieldContainer">
  <label for="chara-input" class="fieldContainer__label">Hero's name</label>
  <input
    [formControl]="charName"
    type="text"
    placeholder="Name your hero…"
    id="chara-input"
    class="fieldContainer__field" />
</div>
<div class="cardsContainer">
  <h3 class="title-3 title-3--label">Pick a Guild</h3>
  @for (item of data; track item.description) {
    <app-character-card
      [isSelected]="selectedGuild === item"
      [guild]="item"
      (pick)="pickGuild(item)" />
  }
</div>
<button
  [disabled]="charName.invalid || !selectedGuild"
  class="interactBtn interactBtn--primary"
  (click)="createCharacter()"
  routerLink="/game/{{ charName.value }}/map">
  🚀 Begin Adventure!
</button>
