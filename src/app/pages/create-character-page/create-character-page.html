<h2>⚔️ Create A Hero</h2>
<div>
  <label for="chara-input">Hero's name</label>
  <input [formControl]="charName" type="text" placeholder="Name your hero…" id="chara-input" />
</div>
<div>
  <h3>Pick a Guild</h3>
  @for (guild of guildChoices; track guild.description) {
    <app-character-card
      [isSelected]="selectedGuild === guild"
      [guild]="guild"
      (cardSelect)="pickGuild(guild)" />
  }
</div>
<button
  [disabled]="charName.invalid || !selectedGuild"
  (click)="createCharacter()"
  routerLink="/game/{{ charName.value }}/map">
  🚀 Begin Adventure!
</button>
