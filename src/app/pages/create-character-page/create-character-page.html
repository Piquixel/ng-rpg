<h2 class="headingLv2">⚔️ New Adventure</h2>

<div>
  <fieldset>
    <legend>Choose a name for your hero</legend>
    <input [formControl]="playerName" type="text" placeholder="Name your hero…" id="chara-input" />
  </fieldset>
  <fieldset>
    <legend>Pick a guild</legend>
    <div class="cardsContainer">
      @for (guild of guildChoices; track guild.description) {
        <app-character-card
          [isSelected]="selectedGuild === guild"
          [guild]="guild"
          (cardSelect)="pickGuild(guild)" />
      }
    </div>
  </fieldset>
  <fieldset>
    <app-char-stats [class.open]="selectedGuild" [guild]="selectedGuild" />
  </fieldset>
</div>

<button
  class="btnPrimary"
  [disabled]="playerName.invalid || !selectedGuild"
  (click)="createCharacter()"
  routerLink="/game/{{ playerName.value }}/map">
  🚀 Begin Adventure!
</button>
