<div class="quickStats">
  <span class="playerNickname">{{ player().icon }}{{ player().nickname }}</span>
  <div>
    <span class="playerLevel">{{ player().lvl }}</span>
    <span class="playerMoney">£{{ player().money | interfaceDigits }}</span>
  </div>
</div>
<nav class="gameMenu">
  <ul class="menuComponents">
    @for (link of links; track link.link) {
      <li class="menuComponents__item">
        <button
          class="menuComponents__button btnLink btnLink--pill"
          routerLinkActive="active"
          routerLink="/game/{{ link.link }}">
          {{ link.icon }}
          <span>{{ link.link | titlecase }}</span>
        </button>
      </li>
    }
  </ul>
</nav>
<div>
  <div>
    <button class="btnUtility btnThin" (click)="gameManager.onSave()">Save</button>
    <button class="btnUtility btnThin">Quit</button>
  </div>
</div>
