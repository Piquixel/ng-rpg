<div class="action-wrapper">
  <div class="action-group common-actions">
    <button
      [disabled]="!disabled()"
      (click)="playerAtk.emit()"
      class="btnUtility action-btn primary">
      <span class="btn-icon">🗡️</span>
      <span class="btn-label">Attack</span>
    </button>
    <button
      [disabled]="!disabled()"
      (click)="playerQuit.emit()"
      class="btnUtility action-btn danger">
      <span class="btn-icon">🏃</span>
      <span class="btn-label">Run Away</span>
    </button>
  </div>

  <div class="action-group">
    <h4 class="group-title">✨ Skills</h4>
    <div class="group-grid">
      @for (item of typeActions; track item.name) {
        <button [disabled]="!disabled()" class="btnUtility action-btn skill">
          <span class="btn-icon">{{ item.icon }}</span>
          <span class="btn-label">{{ item.name }}</span>
          <span class="btn-cost">{{ item.cost }} PM</span>
        </button>
      }
    </div>

    <div class="action-group">
      <h4 class="group-title">🎒 Inventory</h4>
      <div class="group-grid">
        @for (item of inventoryActions; track item.name) {
          <button [disabled]="!disabled()" class="btnUtility action-btn item">
            <span class="btn-icon">{{ item.icon }}</span>
            <span class="btn-label">{{ item.name }}</span>
            <span class="btn-cost qty">&times;{{ item.quantity }}</span>
          </button>
        }
      </div>
    </div>
  </div>
</div>
