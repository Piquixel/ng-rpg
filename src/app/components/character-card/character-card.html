<button [class.selected]="isSelected()" (click)="cardSelect.emit()">
  <div>
    <h1>{{ guild().icon }}</h1>
    <h4>{{ guild().name }}</h4>
    <p>{{ guild().description }}</p>
    <div>
      @for (feature of guild().features; track $index) {
        <span>{{ feature }}</span>
      }
    </div>
    <app-char-stats [class.open]="isSelected()" [guild]="guild()" />
  </div>
</button>
