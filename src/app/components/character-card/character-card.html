<button class="btnContainer" [class.selected]="isSelected()" (click)="cardSelect.emit()">
  <div class="card">
    <span id="guild-icon">{{ guild().icon }}</span>
    <h3 id="guild-name">{{ guild().name }}</h3>
    <p id="guild-description">{{ guild().description }}</p>
    <div id="guild-features">
      @for (feature of guild().features; track $index) {
        <span class="feature">{{ feature }}</span>
      }
    </div>
  </div>
</button>
